<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Furniture Price Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div id="wrap">

        <h1>Predict Furniture Price</h1>

        <section id="furn" class="frame2">

            <div class="login">

                <form action="{{ url_for('predict') }}" method="post">

                    <table class="entryForm">

                        <!-- Category -->
                        <tr>
                            <th>Category:</th>

                            <td>
                                <select id="category" name="category">

                                    <option value="0">Bar furniture</option>
                                    <option value="1">Beds</option>
                                    <option value="2">Bookcases & shelving units</option>
                                    <option value="3">Cabinets & cupboards</option>
                                    <option value="4">Cafe furniture</option>
                                    <option value="5">Chairs</option>
                                    <option value="6">Chests of drawers & drawer units</option>
                                    <option value="7">Children's furniture</option>
                                    <option value="8">Nursery furniture</option>
                                    <option value="9">Outdoor furniture</option>
                                    <option value="10">Room dividers</option>
                                    <option value="11">Sideboards, buffets & console tables</option>
                                    <option value="12">Sofas & armchairs</option>
                                    <option value="13">Tables & desks</option>
                                    <option value="14">Trolleys</option>
                                    <option value="15">TV & media furniture</option>
                                    <option value="16">Wardrobes</option>

                                </select>
                            </td>
                        </tr>


                        <!-- Sellable Online -->
                        <tr>
                            <th>Sellable Online:</th>

                            <td>
                                <input type="radio"
                                       name="sellable_online"
                                       value="1"
                                       checked>
                                Yes

                                <input type="radio"
                                       name="sellable_online"
                                       value="0">
                                No
                            </td>
                        </tr>


                        <!-- Other Colors -->
                        <tr>
                            <th>Other Colors:</th>

                            <td>
                                <input type="radio"
                                       name="other_colors"
                                       value="1"
                                       checked>
                                Yes

                                <input type="radio"
                                       name="other_colors"
                                       value="0">
                                No
                            </td>
                        </tr>


                        <!-- Depth -->
                        <tr>
                            <th>Depth:</th>

                            <td>
                                <input type="number"
                                       name="depth"
                                       placeholder="Depth in cm"
                                       step="0.1"
                                       required>
                            </td>
                        </tr>


                        <!-- Height -->
                        <tr>
                            <th>Height:</th>

                            <td>
                                <input type="number"
                                       name="height"
                                       placeholder="Height in cm"
                                       step="0.1"
                                       required>
                            </td>
                        </tr>


                        <!-- Width -->
                        <tr>
                            <th>Width:</th>

                            <td>
                                <input type="number"
                                       name="width"
                                       placeholder="Width in cm"
                                       step="0.1"
                                       required>
                            </td>
                        </tr>

                    </table>


                    <div class="btns">

                        <button type="reset"
                                class="btn btn-clear">
                            Reset
                        </button>

                        <button type="submit"
                                class="btn btn-primary btn-block btn-large">
                            Predict
                        </button>

                    </div>

                </form>

            </div>

        </section>


        <br>
        <br>

        <!-- Prediction result -->
        <h2>
            {{ prediction_text }}
        </h2>

    </div>

</body>

</html>
